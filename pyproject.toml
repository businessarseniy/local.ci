[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ci"
version = "0.1.0"
description = "Tool for running local CI jobs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
    "pydantic",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.scripts]
local-ci = "main:main"

[tool.setuptools]
packages = [
    "backend",
    "config",
    "core",
]
py-modules = ["main"]
