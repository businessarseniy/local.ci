image: "python:3.13-slim"
env:
  values: {}

# Using setup as root user global installation
# as trick. Can't find any solution for abscent
# HOME directory for current user and PATH not
# not containing user's installs
setup:
  - name: Install tool package
    run: pip install .[test]

install: []

test:
  - name: Installed package
    run: bash -c "pip list | grep local-ci"
  - name: Tool entrypoint
    run: ./main.py --version
  - name: Global tool entrypoint
    run: local-ci --version
  - name: Unit-tests
    run: pytest -v .
