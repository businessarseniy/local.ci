# Define running environment
image: "python:3.12-slim"
env:
  values:
    KEY: VALUE

# Before any execution (system setup)
setup:
  - run: apt-get update
  - run: apt install -y make

# Project installs (requirements and other stuff,
# ran under unprivilliged user)
install:
  - run: make
  - run: make install

# Actual test scripts
test:
  - run: python3 main.py --version

# Deploy the application
deploy:
  provider: localhost
  secret:
    KEY: VALUE
  branch: master

# Notify codeowners for results
notify:
  email: ...
